name: drive

services:
  db:
    image: postgres:16-alpine
    container_name: drive-db
    hostname: drive-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drive}
      POSTGRES_USER: ${POSTGRES_USER:-drive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Définissez APP_DB_PASSWORD dans .env}
    volumes:
      - ${DRIVE_DATA_PATH:-/opt/drive/data}/postgres:/var/lib/postgresql/data
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  api:
    build:
      context: ./server
    container_name: drive-api
    hostname: drive-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${APP_DATABASE_URL:?Définissez APP_DATABASE_URL dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-12}
      FUEL_DATA_API_URL: ${FUEL_DATA_API_URL:-https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records}
    volumes:
      - ${DRIVE_DATA_PATH:-/opt/drive/data}/uploads:/data/uploads
    expose:
      - "3000"
    networks:
      - private
      - egress
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:?Définissez DATABASE_URL dans .env}
      UPLOAD_DIR: /data/uploads
    volumes:
      - ${DRIVE_MIGRATION_PATH:-/opt/drive/migration-data}:/migration:ro
      - ${DRIVE_DATA_PATH:-/opt/drive/data}/uploads:/data/uploads
    command: ["node", "scripts/import-supabase.js", "/migration"]
    user: "0:0"
    networks:
      - private
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    restart: "no"

  backup:
    image: postgres:16-alpine
    container_name: drive-backup
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-drive}
      PGUSER: ${POSTGRES_USER:-drive}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${DRIVE_DATA_PATH:-/opt/drive/data}/backups:/backups
      - ${DRIVE_DATA_PATH:-/opt/drive/data}/uploads:/uploads:ro
      - ./deploy/backup.sh:/usr/local/bin/drive-backup:ro
    command: ["/bin/sh", "/usr/local/bin/drive-backup"]
    user: "1000:1000"
    networks:
      - private
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "find /backups -type f -name 'drive-*.dump' -mmin -1500 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped


  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drive-web
    hostname: drive-web
    expose:
      - "80"
    networks:
      - private
      - proxy
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=32m
      - /run:rw,nosuid,nodev,noexec,size=8m
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    pids_limit: 64
    labels:
      - traefik.enable=true
      - traefik.docker.network=${DRIVE_PROXY_NETWORK:-mca-public}
      - traefik.http.routers.drive.rule=Host(`${DRIVE_DOMAIN:-drive.mycloudapi.fr}`)
      - traefik.http.routers.drive.entrypoints=websecure
      - traefik.http.routers.drive.tls.certresolver=letsencrypt
      - traefik.http.services.drive.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  private:
    name: drive-private
    internal: true
  egress:
    name: drive-egress
  proxy:
    external: true
    name: ${DRIVE_PROXY_NETWORK:-mca-public}
